<title>Sumire+ メニュー</title>
<!-- 829_ #13 Sumire+ PC トップメニュー（GitHub Pages + iframe ラッパー方式・D-118 流用・案B×案1） -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon_192.png">
<link rel="apple-touch-icon" href="icon_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sumire+">
<meta name="theme-color" content="#5b3fb0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: linear-gradient(135deg, #efe9fb, #e7f0fb);
    color: #2b2b3a;
  }
  /* ===== メニュー画面 ===== */
  #menu-screen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 24px;
  }
  .home-wrap { width: 100%; max-width: 1100px; }
  .home-header { text-align: center; margin-bottom: 40px; }
  .home-logo { font-size: 30px; font-weight: 800; color: #5b3fb0; }
  .home-sub { font-size: 15px; color: #7a6ea8; margin-top: 8px; }
  .home-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .home-note { margin-top: 22px; text-align: center; font-size: 13px; color: #7a6ea8; line-height: 1.7; }
  .home-card {
    height: 210px; border-radius: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    position: relative; color: #fff; text-decoration: none; border: none; cursor: pointer;
    font-family: inherit; transition: transform .15s ease, box-shadow .15s ease;
  }
  .home-em { font-size: 54px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.18)); line-height: 1; }
  .home-nm { font-size: 19px; font-weight: 800; }
  .home-tag {
    position: absolute; right: 12px; top: 12px;
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
    background: rgba(255,255,255,.28); color: #fff;
  }
  .act1 { background: linear-gradient(135deg, #34c77b, #1f9e8f); box-shadow: 0 10px 22px rgba(31,158,143,.30); }
  .act2 { background: linear-gradient(135deg, #5b8def, #6f86f0); box-shadow: 0 10px 22px rgba(91,141,239,.30); }
  /* カイポケ取込＝絵から取り出した黄色〜オレンジ（1166_） */
  .act3 { background: linear-gradient(135deg, #f9b233, #ef8200); box-shadow: 0 10px 22px rgba(239,130,0,.30); }
  /* (1275_/D-329) 職員名簿＝濃い紫（谷川さん決定 2026-07-28）。2段目に1枚。今の4枚は1バイトも変えない。 */
  .act4 { background: linear-gradient(135deg,#6d43d6,#46249c); box-shadow:0 10px 22px rgba(70,36,156,.32); }
  /* 🆕 (2161_/D-858・D-854) 職員名簿＝ピンク（谷川さん「変更報告と職員名簿の色が同じなので色をかえろ」→「もう少し綺麗な色に」）。
     act4（紫）は変更報告の札が使い続ける＝1文字も変えていない。 */
  .act5 { background: linear-gradient(135deg,#f48fb1,#ec407a); box-shadow:0 10px 22px rgba(236,64,122,.30); }
  /* 🆕 (2640_/出す_2639) 医療保険照会＝水色（使用率モニターの act2 と同じ色だったのを分けた）。 */
  .act6 { background: linear-gradient(135deg,#3bc9db,#0c8599); box-shadow:0 10px 22px rgba(12,133,153,.30); }
  /* 🆕 (3034_/出す_3030) 印刷＝オレンジ（印刷の画面の上の帯と同じ色）。 */
  .act7 { background:linear-gradient(135deg,#e8590c,#fd7e14); box-shadow:0 10px 22px rgba(232,89,12,.30); }
  .soon { background: linear-gradient(135deg, #cfcfda, #b9b9c8); box-shadow: 0 10px 22px rgba(150,150,170,.22); cursor: default; }
  /* 🚨 押し心地の行は2本ある（:hover と :active）。両方に act4 を足す＝この1枚だけ挙動が違うのを防ぐ（1167_ の教訓）
     🆕 (2161_/D-858) act5（職員名簿のピンク）も2本とも足した。🆕 (2640_) act6（医療保険照会の水色）も2本とも足した。 */
  .home-card.act1:hover, .home-card.act2:hover, .home-card.act3:hover, .home-card.act4:hover, .home-card.act5:hover, .home-card.act6:hover, .home-card.act7:hover { transform: translateY(-4px); box-shadow: 0 16px 30px rgba(80,80,120,.28); }
  .home-card.act1:active, .home-card.act2:active, .home-card.act3:active, .home-card.act4:active, .home-card.act5:active, .home-card.act6:active, .home-card.act7:active { transform: translateY(-1px); }
  /* 絵は .home-em と同じ 54px 枠に収め、字の位置をそろえる（transform ゆえレイアウト不動） */
  .ic-kaipoke { height: 54px; display: flex; align-items: flex-end; justify-content: center;
                filter: drop-shadow(0 5px 9px rgba(80,35,0,.42)); }
  .ic-kaipoke img { height: 80px; width: auto; display: block; transform: translateY(19px); }
  /* (1275_/D-329) 職員名簿の絵。カイポケと同じ作法（54px 枠・下端そろえ・影だけ・白いふち無し） */
  .ic-roster { height: 54px; display: flex; align-items: flex-end; justify-content: center;
               filter: drop-shadow(0 5px 9px rgba(150,20,80,.40)); }  /* 🆕 (2161_/D-858) 絵の影もピンクの色みに（札がピンクになったため） */
  .ic-roster img { height: 80px; width: auto; display: block; transform: translateY(17px); }
  /* (1265_/D-325) カイポケ取込の「前回の取込日時」1行だけ（谷川さんが調整プレビューで実測確定 2026-07-27）。
     ほかの4枚と寸法は共有しない＝この行だけの見た目。読めないうちは hidden＝行ごと出ない（＝今までどおりのボタン）。 */
  .home-stamp { font-size: 15px; font-weight: 700; color: #fff; background: rgba(0,0,0,.16);
                padding: 3px 12px; border-radius: 999px; margin-top: 2px; white-space: nowrap; line-height: 1.4;
                text-align: center; }
  /* (1269_/D-327) 状態の出し分け＝取込中は濃いめの帯／失敗は白地に赤字（遠目でも「赤い＝いつもと違う」と分かる）。
     ボタン4枚の寸法・色・絵・並びは変えない＝この1行の中だけの見た目。 */
  .home-stamp.run { background: rgba(0,0,0,.28); }
  .home-stamp.ng  { background: #fff; color: #c62828; }
  .home-stamp .kd-sub { display: block; font-size: 13px; font-weight: 700; line-height: 1.35; }
  /* (1271_/D-328) 取込中の見せ方＝くるくる＋横棒＋「あと約○分」。
     数字は谷川さんが調整ページ（P004_カイポケ取込中の見た目調整_案B_2026-07-28.html）で実測して確定。
     14px／線3px／すき間7px／字15px／帯 rgba(0,0,0,.28)／横棒 太さ8px・下から0px・左右0px・角0px・白／
     「あと約○分」13px・下から11px・右から12px。
     ★ボタン4枚の寸法・色・絵・並びは1文字も変えない＝カイポケ取込の1枚の中だけの見た目。 */
  .home-stamp.run { display: flex; align-items: center; gap: 7px; }
  .spin { width: 14px; height: 14px; border: 3px solid rgba(255,255,255,.35);
          border-top-color: #fff; border-radius: 50%; animation: kd-sp .9s linear infinite; flex: none; }
  @keyframes kd-sp { to { transform: rotate(360deg); } }
  .bar-wrap { position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
              background: rgba(0,0,0,.20); border-radius: 0; overflow: hidden; }
  /* 進む速さは読み直しの間かく（5秒）と同じにする＝更新のあいだもなめらかに動いて見える（カクカクさせない） */
  .bar { height: 100%; width: 0%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6);
         border-radius: 0; transition: width 5s linear; }
  .bar.fin { transition: width .45s ease-out; }   /* 本当に終わったときだけ 100% まで一気に */
  .bar-cap { position: absolute; right: 12px; bottom: 11px; font-size: 13px;
             font-weight: 700; color: rgba(255,255,255,.95); }
  @media (max-width: 920px) { .home-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .home-grid { grid-template-columns: 1fr; } .home-card { height: 150px; } }
  /* ===== はめ込み画面（iframe） ===== */
  #frame-screen { display: none; height: 100vh; flex-direction: column; }
  #frame-bar {
    height: 46px; flex: 0 0 46px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, #7c5cd6, #5b8def); color: #fff; padding: 0 14px;
    box-shadow: 0 2px 8px rgba(80,80,120,.25);
  }
  #back-btn {
    border: none; background: rgba(255,255,255,.22); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 800; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  #back-btn:hover { background: rgba(255,255,255,.34); }
  #frame-title { font-size: 15px; font-weight: 800; }
  /* 🆕 (2883_/出す_2881) 紫の帯で 📞 が見えにくい＝📞 の後ろに白い丸（字の大きさ・帯の高さは変えない）。付けるのは shellTitleDisc_ だけ。 */
  #frame-title .ico-disc { display: inline-flex; align-items: center; justify-content: center; width: 1.4em; height: 1.4em; margin: -.2em 0; border-radius: 50%; background: #fff; line-height: 1; vertical-align: middle; }
  #app-frame { flex: 1 1 auto; width: 100%; border: none; background: #fff; }
  /* (2006_/便2) 画面ごとに持ち続ける窓。#app-frame と同じ見た目にそろえる（新しい見た目を作っていない）。
     🚨 隠し方は display:none の1通りだけ（JS 側でしか付け外ししない）。 */
  .app-pane { flex: 1 1 auto; width: 100%; border: none; background: #fff; }

  /* (1720_/便19) フォルダを枠の外に落としたときの短い案内。
     🚨 見た目に関わるのはこの1本だけ＝ふだんは display:none＝便18までと1ドット同じ画面。 */
  #drop-hint {
    display: none; position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 99999; max-width: 92vw; padding: 14px 22px; border-radius: 12px;
    background: rgba(30,30,40,.94); color: #fff; font-size: 15px; font-weight: 700;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); pointer-events: none; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #drop-hint.show { display: block; }
  /* (2725_/出す_2724) 新しい版が公開されたときだけ出る上の帯（押すと読み直す）。
     ふだんは hidden＝今までと1ドット同じ画面。出ている間だけ body.upd-on で 44px 下げる。 */
  #upd-band {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99990;
    display: block; width: 100%; height: 44px; padding: 0 16px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #f9b233, #ef8200); color: #fff;
    font-family: inherit; font-size: 16px; font-weight: 800; line-height: 44px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 2px 8px rgba(239,130,0,.35);
  }
  #upd-band[hidden] { display: none; }                  /* 書かないと上の display に負けて出たままになる */
  body.upd-on { padding-top: 44px; }
  body.upd-on #frame-screen { height: calc(100vh - 44px); }
  body.upd-on #menu-screen { min-height: calc(100vh - 44px); }
  /* 🆕 (3583_/出す_3581) 窓を初めて読み込む間だけ、白い画面の代わりに今ある「本を読む犬」と「読み込み中…」を出す（新しい絵・字は作らない）。
     下の9行は forms の dashboard_dog_css.html 5・7・12・13・14・16・18行と dashboard_css.html 1030・1032行を1文字も変えずに写した（検査 3583_ が行ごとに比べる）。
     置き場所と重ね方だけ #shell-wait で書く＝帯の下の窓の所だけを覆う（◀ メニューは押せる）・暗さはダッシュボードの犬と同じ。 */
  #frame-screen { position: relative; }
  #shell-wait { position: absolute; left: 0; right: 0; top: 46px; bottom: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.45); }
  #shell-wait.active { display: flex; }
.center-loading .cl-dog { height:150px; background-repeat:no-repeat; background-size:400% 100%; animation:dog-play .8s steps(4,jump-none) infinite; margin:0 auto; }

<body>
  <button type="button" id="upd-band" hidden></button>
  <!-- メニュー画面（案B×案1） -->
  <div id="menu-screen">
    <div class="home-wrap">
      <header class="home-header">
        <div class="home-logo">🟣 Sumire+ メニュー</div>
      </header>
      <main class="home-grid">
        <button type="button" class="home-card act1" id="card-pc">
          <div class="home-em">📦</div>
          <div class="home-nm">振分けダッシュボード</div>
        </button>
        <button type="button" class="home-card act2" id="card-monitor">
          <div class="home-em">📊</div>
          <div class="home-nm">使用率モニター</div>
        </button>
        <button type="button" class="home-card act3" id="card-kaipoke">
          <span class="ic-kaipoke"><img src="kaipoke.png" alt=""></span>
          <div class="home-nm">カイポケ取込</div>
          <!-- 1265_/D-325 前回の取込日時 → 1269_/D-327 取込中／終わった／失敗 の状態1か所（読めるまで出さない）
               → 1271_/D-328 取込中はくるくる＋横棒＋「あと約○分」を足す（取込中でないときは今までどおりの1行） -->
          <div class="home-stamp" id="kd-stamp" hidden>
            <span class="spin" id="kd-spin" hidden></span><span id="kd-stamp-t"></span><span class="kd-sub" id="kd-stamp-s" hidden></span>
          </div>
          <div class="bar-cap" id="kd-cap" hidden></div>
          <div class="bar-wrap" id="kd-bar-wrap" hidden><div class="bar" id="kd-bar"></div></div>
        </button>
        <button type="button" class="home-card act4" id="card-change">
          <div class="home-em">📝</div>
          <div class="home-nm">変更報告入力</div><!-- 🆕 (2161_/D-858) 札の字（紫 act4 のまま） -->
        </button>
        <!-- (1275_/D-329) 5枚目＝職員名簿。4列グリッドの5枚目ゆえ自動で2段目の左端に出る。
             まねる相手は card-pc / card-monitor（押したら窓内にはめ込むだけの単純な形）。
             card-kaipoke は取込の状態表示（くるくる・横棒・postMessage）を持つ特別な作りゆえ まねない。 -->
        <button type="button" class="home-card act5" id="card-staff"><!-- 🆕 (2161_/D-858) 紫 act4 → ピンク act5 -->
          <span class="ic-roster"><img src="staff_roster.png" alt=""></span>
          <div class="home-nm">職員名簿</div>
        </button>
        <!-- 🆕 (2637_/出す_2636) 6枚目＝🪪 照会ファイル（オンライン資格確認の一括照会のファイルを作って落とす）。
             2段目の2番目に出る。まねる相手は card-staff（押したら窓内にはめ込むだけ）。
             🆕 (2640_/出す_2639) 名前を「医療保険照会」に・色を水色 act6 に（照会結果とカイポケの違いの画面を足した）。 -->
        <button type="button" class="home-card act6" id="card-oqs">
          <div class="home-em">🪪</div>
          <div class="home-nm">医療保険照会</div>
        </button>
        <!-- 🆕 (3034_/出す_3030) 7枚目＝🖨️ 印刷（送付ラベルなどを印刷する）。2段目の3番目に出る。まねる相手は card-oqs（押したら窓内にはめ込むだけ）。 -->
        <button type="button" class="home-card act7" id="card-print">
          <div class="home-em">🖨️</div>
          <div class="home-nm">印刷</div>
        </button>
      </main>
    </div>
  </div>

  <!-- はめ込み画面（振分けダッシュボードを全画面 iframe で表示） -->
  <div id="frame-screen">
    <div id="frame-bar">
      <button type="button" id="back-btn">◀ メニュー</button>
      <span id="frame-title">📦 振分けダッシュボード</span>
    </div><!-- frame-title はカードに応じて差し替え -->

    <iframe id="app-frame" src="" allow="fullscreen" allowfullscreen></iframe>
    <!-- 🆕 (3583_/出す_3581) 窓を初めて読み込む間だけ出す犬（字は dashboard_js.html の showCenterLoading_ と同じ） -->
    <div id="shell-wait" class="center-loading" aria-live="polite"><div class="cl-card"><div class="cl-dog book"></div><div class="cl-bar green"><span></span></div><div class="cl-text">読み込み中…</div></div></div>
  </div>

  <script>
    // ================================================================================
    // (2006_/便2) 外枠の札＝画面ごとに窓を持ち続けるかどうか。

      var GAP_MS  = 30000;   // 30秒ごとに読み直す（開きっぱなしのパソコンでも新しくなる）

      // いまの見せ方＝''（今までどおりの1行）／'local'（押した直後・GAS の返事待ち）／'run'（GAS が取込中）／'fin'（100%を見せている最中）

      // カイポケ取込（このパソコンの「カイポケ取込」を起動する＝画面内はめ込みでは動かないので location で開く）

          //   守りは上の yotei-run の枝と同じ3つ＝(a) いま比較を出しているときだけ（list-compare の枝と同じ字）(b) 前に開いてから10秒は何もしない (c) location.href。
          //   🚨 【else if の連鎖の中】に置く（最後の else の後ろだと「メニューに戻る」に化ける）。
          if (frameTitle.textContent !== '🔍 リスト・カイポケ比較') return;
          var nowLc = Date.now();
          if (nowLc - (window.__lcRunLastAt || 0) < 10000) return;   // 前に開いた時刻はこの枝の中だけで持つ
          window.__lcRunLastAt = nowLc;
          location.href = 'sumire-kaipoke:run';
        } else if (d.to === 'fx-run') {
          // 🆕 (3141_/出す_3138) 🖨️ 印刷の「📠 FAX送付状」月末実績の「🔄 最新情報に更新」＝予定表チェックと同じ道具を起こす合図（中身は Google 側の頼み＝月末の一覧だけ読む）。
          //   守りは上の yotei-run の枝と同じ3つ＝(a) いま印刷を出しているときだけ（openInFrame('print', …) と同じ字）(b) 前に開いてから10秒は何もしない (c) location.href。
          //   🚨 【else if の連鎖の中】に置く（最後の else の後ろだと「メニューに戻る」に化ける）。
          if (frameTitle.textContent !== '🖨️ 印刷') return;
          var nowFx = Date.now();
          if (nowFx - (window.__fxRunLastAt || 0) < 10000) return;   // 前に開いた時刻はこの枝の中だけで持つ
          window.__fxRunLastAt = nowFx;
          location.href = 'sumire-yotei:run';
        } else if (d.to === 'ask-ticket') {
          // 🆕 (2597_) 中の画面（変更内容確認・予定表チェック）が「預かり物はありますか」と聞く。画面は動かさない＝返事を返すだけ。
          //   🚨 中身を返すのは、聞いた画面＝預かった先＝いま出している画面 がそろい、60秒以内のときだけ。渡したら消す（1回きり）。
          //   🚨 返事の宛先は聞いてきた窓と出どころだけ（'*' は使わない・MDN の返し方）。送り主をたどる新しい守りは作らない（D-693）。
          //   🚨 【else if の連鎖の中】に置く（最後の else の後ろだと「メニューに戻る」に化ける）。
          //   🆕 (2680_) irenew・lcmp も聞いてよい（預かり物は無いので必ず「無し」が返る＝開いたときに返事の宛先を覚えてもらうための合図）。
          //   🆕 (3320_/出す_3313) pc（ダッシュボード）・change（変更報告）も同じ＝開いたときに宛先を覚えてもらい、出し直したら「出しました」を送る（隠れた窓には「出た」がときどき届かない・2006_／2013_）。
          if ((d.who !== 'pc' && d.who !== 'change' && d.who !== 'entry' && d.who !== 'ycheck' && d.who !== 'irenew' && d.who !== 'lcmp' && d.who !== 'pmemo' && d.who !== 'selfpay') || typeof d.id !== 'string' || !/^[A-Za-z0-9]{8,32}$/.test(d.id)) return;
          var tk = SHELL_TICKET_, ans = { type: 'sumire-ticket', id: d.id, who: d.who };
          if (tk && tk.view === d.who && shellCur_ === d.who && (Date.now() - tk.at) <= 60000) {
            SHELL_TICKET_ = null;
            if (tk.receipt) { ans.receipt = tk.receipt; ans.from = 'ycheck'; }
            if (tk.keep) ans.keep = true;
          } else {
            ans.none = true;
          }
          try { if (ev.source) ev.source.postMessage(ans, ev.origin); } catch (e) {}
        } else {
          document.getElementById('back-btn').click();
        }
      });
    })();
  </script>

  <script>
    // ================================================================================
    // (1720_/便19・D-554) ブラウザがフォルダを勝手に開くのを止める（＝「無題」の窓を出さない）。
    //   谷川さん逐語（2026-08-28）＝「どのPCでもできるようにつくれ！あと事務員PCに落とし込む作業なしでできるようにしろ」。
    //   便18で入れた置き場は、机のアイコン → この紙 → はめ込んだダッシュボード という**入れ子**で開くと効かなかった。
    //   いちばん外側のこの紙には横取り止めが1つも無く、枠から少しでも外れて落とすと
    //   ブラウザがフォルダを開いて「無題」の窓が出ていた。
    //
    //   🚨 この紙の役目は **2つだけ**＝①ブラウザに開かせない ②どこへ落とせばよいか出す。
    //      はめ込み画面（#app-frame）の**中**に落ちた分は、この紙では1つも受け取れない
    //      （GAS は中身をさらに googleusercontent の枠に入れて出す＝公式仕様の二重 iframe）。
    //      → 中に落ちた分は**中の画面**の担当（dashboard_js.html の受け口）。責務はここで切る。
    //   🚨 外から中へファイルを渡す道は**作らない**（postMessage でファイルを送らない）。
    //   🚨 #app-frame の中身・src の作り方・合言葉の扱いには1文字も触っていない。
    //   🚨 ファイルは1バイトも読まない・どこにも送らない（案内を出すだけ）。
    // ================================================================================
    (function () {
      // 🚨 案内の入れ物は**この script より後ろ**に置いてある＝ここで一度に取ると必ず null になる
      //    （2026-08-28 実機のブラウザで実際に空振りした＝S-1c が赤になって見つけた）。
      //    ∴ 使うときに取りに行く。
      var hintTimer = null;
      function hintEl() { return document.getElementById('drop-hint'); }
      // ドラッグしているものが「ファイル（フォルダを含む）」かどうか。
      //   🚨 文字や画像のドラッグでは止めない＝ふだんの操作を1つも壊さない。
      function isFileDrag(e) {
        var t = e.dataTransfer && e.dataTransfer.types;
        if (!t) return false;
        for (var i = 0; i < t.length; i++) { if (t[i] === 'Files') return true; }
        return false;
      }
      function showHint() {
        var hint = hintEl();
        if (!hint) return;
        hint.classList.add('show');
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { var h = hintEl(); if (h) h.classList.remove('show'); hintTimer = null; }, 4000);
      }
      // capture 段（第3引数 true）＝どこに落ちても、ほかの処理より先に止める。
      ['dragenter', 'dragover'].forEach(function (ev) {
        document.addEventListener(ev, function (e) {
          if (!isFileDrag(e)) return;
          e.preventDefault();                                  // これを止めないとブラウザがファイルを開く（公式仕様）
          if (e.dataTransfer) { try { e.dataTransfer.dropEffect = 'none'; } catch (_) {} }
        }, true);
      });
      document.addEventListener('drop', function (e) {
        if (!isFileDrag(e)) return;
        e.preventDefault();                                    // 「無題」の窓を出さない
        showHint();                                            // 落とし先を短く案内するだけ（読まない・送らない）
      }, true);
    })();
  </script>

  <script>
    /* (2725_/出す_2724) 開いたままの外枠が古いままになる（2680_ の行き先が事務の PC に届かなかった）のを
       知らせる帯。新しい版に気づいたら帯を出すだけで、読み直すのは帯を押したときだけ（途中の入力を消さない）。
       - 開いた直後に、いま読んだ自分の中身を写しから取って覚える（force-cache＝網へはふつう行かない）。
       - 前に出ている間だけ10分ごと（＋前に戻ったとき）に HEAD で印（ETag）だけ聞く。
         GitHub Pages はどのファイルを push しても印が全部変わるので、印が違ったら中身を取って字で比べる。
       - 押したら写しを新しい物に入れ替えてから読み直す（reload が写しを使うかはブラウザ次第のため）。
       - 失敗したら何も出さない（帯が出ないだけ）。覚えた中身はこの中の変数だけ（保存場所には書かない）。 */
    (function () {
      var band = document.getElementById('upd-band');
      if (!band || !window.fetch) return;
      var EVERY_MS = 10 * 60 * 1000;
      var url = location.href.split('#')[0];
      var mine = null, tag = '', lastAsk = Date.now(), busy = false, timer = 0, going = false;
      band.textContent = 'Sumire+ のアップデート版があります。ここを押して更新してください。';
      function etagOf(r) { return (r.headers.get('ETag') || '').replace(/^W\//, ''); }
      function stop() {
        if (timer) { clearInterval(timer); timer = 0; }
        document.removeEventListener('visibilitychange', onVis);
      }
      function show() {
        stop();
        band.hidden = false;
        document.body.classList.add('upd-on');
        // (3214_/出す_3191) 幅 390 では字が「…」で切れる＝帯は広げず、切れるときだけ短い字にする（決定メモ 3191_ 追記 14:58）
        if (band.scrollWidth > band.clientWidth) band.textContent = 'アップデート版があります。ここを押して更新';
      }
      function ask() {
        if (mine === null || busy || document.hidden) return;
        if (Date.now() - lastAsk < EVERY_MS) return;
        busy = true;
        lastAsk = Date.now();                                  // 聞き始めの時刻（間隔が倍に延びないように）
        fetch(url, { method: 'HEAD', cache: 'no-store' })
          .then(function (r) {
            var t = r.ok ? etagOf(r) : '';
            if (!t || t === tag) return;                       // 印が無い・同じ＝何もしない
            return fetch(url, { cache: 'no-store' }).then(function (r2) {
              if (!r2.ok) return;
              return r2.text().then(function (body) {
                if (body === mine) tag = etagOf(r2) || t;      // ほかのファイルの push＝印だけ覚え直す
                else show();
              });
            });
          })
          .catch(function () {})
          .then(function () { busy = false; });
      }
      function onVis() { if (!document.hidden) ask(); }
      fetch(url, { cache: 'force-cache' })
        .then(function (r) {
          if (!r.ok) throw new Error('remember');
          tag = etagOf(r);
          return r.text();
        })
        .then(function (t) { mine = t; })
        .catch(function () { stop(); });                       // 自分を覚えられなければ以後は聞かない
      timer = setInterval(ask, EVERY_MS);
      document.addEventListener('visibilitychange', onVis);
      band.addEventListener('click', function () {
        if (going) return;
        going = true;
        fetch(url, { cache: 'reload' }).catch(function () {}).then(function () { location.reload(); });
      });
    })();
  </script>

  <div id="drop-hint" role="status" aria-live="polite">画面の中の点線の枠に落としてください</div>
</body>

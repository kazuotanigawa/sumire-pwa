<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumire+ メニュー</title>
<!-- 829_ #13 Sumire+ PC トップメニュー（GitHub Pages + iframe ラッパー方式・D-118 流用・案B×案1） -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon_192.png">
<link rel="apple-touch-icon" href="icon_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sumire+">
<meta name="theme-color" content="#5b3fb0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: linear-gradient(135deg, #efe9fb, #e7f0fb);
    color: #2b2b3a;
  }
  /* ===== メニュー画面 ===== */
  #menu-screen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 24px;
  }
  .home-wrap { width: 100%; max-width: 1100px; }
  .home-header { text-align: center; margin-bottom: 40px; }
  .home-logo { font-size: 30px; font-weight: 800; color: #5b3fb0; }
  .home-sub { font-size: 15px; color: #7a6ea8; margin-top: 8px; }
  .home-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .home-note { margin-top: 22px; text-align: center; font-size: 13px; color: #7a6ea8; line-height: 1.7; }
  .home-card {
    height: 210px; border-radius: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    position: relative; color: #fff; text-decoration: none; border: none; cursor: pointer;
    font-family: inherit; transition: transform .15s ease, box-shadow .15s ease;
  }
  .home-em { font-size: 54px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.18)); line-height: 1; }
  .home-nm { font-size: 19px; font-weight: 800; }
  .home-tag {
    position: absolute; right: 12px; top: 12px;
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
    background: rgba(255,255,255,.28); color: #fff;
  }
  .act1 { background: linear-gradient(135deg, #34c77b, #1f9e8f); box-shadow: 0 10px 22px rgba(31,158,143,.30); }
  .act2 { background: linear-gradient(135deg, #5b8def, #6f86f0); box-shadow: 0 10px 22px rgba(91,141,239,.30); }
  /* カイポケ取込＝絵から取り出した黄色〜オレンジ（1166_） */
  .act3 { background: linear-gradient(135deg, #f9b233, #ef8200); box-shadow: 0 10px 22px rgba(239,130,0,.30); }
  .soon { background: linear-gradient(135deg, #cfcfda, #b9b9c8); box-shadow: 0 10px 22px rgba(150,150,170,.22); cursor: default; }
  .home-card.act1:hover, .home-card.act2:hover, .home-card.act3:hover { transform: translateY(-4px); box-shadow: 0 16px 30px rgba(80,80,120,.28); }
  .home-card.act1:active, .home-card.act2:active, .home-card.act3:active { transform: translateY(-1px); }
  /* 絵は .home-em と同じ 54px 枠に収め、字の位置をそろえる（transform ゆえレイアウト不動） */
  .ic-kaipoke { height: 54px; display: flex; align-items: flex-end; justify-content: center;
                filter: drop-shadow(0 5px 9px rgba(80,35,0,.42)); }
  .ic-kaipoke img { height: 80px; width: auto; display: block; transform: translateY(19px); }
  /* (1265_/D-325) カイポケ取込の「前回の取込日時」1行だけ（谷川さんが調整プレビューで実測確定 2026-07-27）。
     ほかの4枚と寸法は共有しない＝この行だけの見た目。読めないうちは hidden＝行ごと出ない（＝今までどおりのボタン）。 */
  .home-stamp { font-size: 15px; font-weight: 700; color: #fff; background: rgba(0,0,0,.16);
                padding: 3px 12px; border-radius: 999px; margin-top: 2px; white-space: nowrap; line-height: 1.4;
                text-align: center; }
  /* (1269_/D-327) 状態の出し分け＝取込中は濃いめの帯／失敗は白地に赤字（遠目でも「赤い＝いつもと違う」と分かる）。
     ボタン4枚の寸法・色・絵・並びは変えない＝この1行の中だけの見た目。 */
  .home-stamp.run { background: rgba(0,0,0,.28); }
  .home-stamp.ng  { background: #fff; color: #c62828; }
  .home-stamp .kd-sub { display: block; font-size: 13px; font-weight: 700; line-height: 1.35; }
  /* (1271_/D-328) 取込中の見せ方＝くるくる＋横棒＋「あと約○分」。
     数字は谷川さんが調整ページ（P004_カイポケ取込中の見た目調整_案B_2026-07-28.html）で実測して確定。
     14px／線3px／すき間7px／字15px／帯 rgba(0,0,0,.28)／横棒 太さ8px・下から0px・左右0px・角0px・白／
     「あと約○分」13px・下から11px・右から12px。
     ★ボタン4枚の寸法・色・絵・並びは1文字も変えない＝カイポケ取込の1枚の中だけの見た目。 */
  .home-stamp.run { display: flex; align-items: center; gap: 7px; }
  .spin { width: 14px; height: 14px; border: 3px solid rgba(255,255,255,.35);
          border-top-color: #fff; border-radius: 50%; animation: kd-sp .9s linear infinite; flex: none; }
  @keyframes kd-sp { to { transform: rotate(360deg); } }
  .bar-wrap { position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
              background: rgba(0,0,0,.20); border-radius: 0; overflow: hidden; }
  /* 進む速さは読み直しの間かく（5秒）と同じにする＝更新のあいだもなめらかに動いて見える（カクカクさせない） */
  .bar { height: 100%; width: 0%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.6);
         border-radius: 0; transition: width 5s linear; }
  .bar.fin { transition: width .45s ease-out; }   /* 本当に終わったときだけ 100% まで一気に */
  .bar-cap { position: absolute; right: 12px; bottom: 11px; font-size: 13px;
             font-weight: 700; color: rgba(255,255,255,.95); }
  @media (max-width: 920px) { .home-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .home-grid { grid-template-columns: 1fr; } .home-card { height: 150px; } }
  /* ===== はめ込み画面（iframe） ===== */
  #frame-screen { display: none; height: 100vh; flex-direction: column; }
  #frame-bar {
    height: 46px; flex: 0 0 46px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, #7c5cd6, #5b8def); color: #fff; padding: 0 14px;
    box-shadow: 0 2px 8px rgba(80,80,120,.25);
  }
  #back-btn {
    border: none; background: rgba(255,255,255,.22); color: #fff; font-family: inherit;
    font-size: 14px; font-weight: 800; padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  #back-btn:hover { background: rgba(255,255,255,.34); }
  #frame-title { font-size: 15px; font-weight: 800; }
  #app-frame { flex: 1 1 auto; width: 100%; border: none; background: #fff; }
</style>
</head>
<body>
  <!-- メニュー画面（案B×案1） -->
  <div id="menu-screen">
    <div class="home-wrap">
      <header class="home-header">
        <div class="home-logo">🟣 Sumire+ メニュー</div>
      </header>
      <main class="home-grid">
        <button type="button" class="home-card act1" id="card-pc">
          <div class="home-em">📦</div>
          <div class="home-nm">振分けダッシュボード</div>
        </button>
        <button type="button" class="home-card act2" id="card-monitor">
          <div class="home-em">📊</div>
          <div class="home-nm">使用率モニター</div>
        </button>
        <button type="button" class="home-card act3" id="card-kaipoke">
          <span class="ic-kaipoke"><img src="kaipoke.png" alt=""></span>
          <div class="home-nm">カイポケ取込</div>
          <!-- 1265_/D-325 前回の取込日時 → 1269_/D-327 取込中／終わった／失敗 の状態1か所（読めるまで出さない）
               → 1271_/D-328 取込中はくるくる＋横棒＋「あと約○分」を足す（取込中でないときは今までどおりの1行） -->
          <div class="home-stamp" id="kd-stamp" hidden>
            <span class="spin" id="kd-spin" hidden></span><span id="kd-stamp-t"></span><span class="kd-sub" id="kd-stamp-s" hidden></span>
          </div>
          <div class="bar-cap" id="kd-cap" hidden></div>
          <div class="bar-wrap" id="kd-bar-wrap" hidden><div class="bar" id="kd-bar"></div></div>
        </button>
        <div class="home-card soon" aria-disabled="true">
          <span class="home-tag">準備中</span>
          <div class="home-em">📝</div>
          <div class="home-nm">変更報告</div>
        </div>
      </main>
    </div>
  </div>

  <!-- はめ込み画面（振分けダッシュボードを全画面 iframe で表示） -->
  <div id="frame-screen">
    <div id="frame-bar">
      <button type="button" id="back-btn">◀ メニュー</button>
      <span id="frame-title">📦 振分けダッシュボード</span>
    </div><!-- frame-title はカードに応じて差し替え -->

    <iframe id="app-frame" src="" allow="fullscreen" allowfullscreen></iframe>
  </div>

  <script>
    // 振分けダッシュボードの本番 Web アプリ URL（GAS exec・誰でもアクセス可=D-083 ALLOWALL・Box認証が壁・秘密値なし）
    var EXEC = 'https://script.google.com/macros/s/AKfycbx0ipQO6w4GhQQVAfuHyoeF5SeGcVg1gGZZHOwvhpG4oeRio2W0VpFENJLvnixeJdee/exec';

    var menuScreen = document.getElementById('menu-screen');
    var frameScreen = document.getElementById('frame-screen');
    var appFrame = document.getElementById('app-frame');
    var frameTitle = document.getElementById('frame-title');

    // 各機能をアプリ窓の中に全画面ではめ込む（振分け・モニターとも ALLOWALL ＝埋め込み可）
    function openInFrame(view, title) {
      appFrame.src = EXEC + '?view=' + view;
      frameTitle.textContent = title;
      menuScreen.style.display = 'none';
      frameScreen.style.display = 'flex';
    }
    // 📦 振分けダッシュボード
    document.getElementById('card-pc').addEventListener('click', function () {
      openInFrame('pc', '📦 振分けダッシュボード');
    });
    // 📊 使用率モニター（振分けと同じく窓内はめ込み・◀メニューで戻れる）
    document.getElementById('card-monitor').addEventListener('click', function () {
      openInFrame('monitor', '📊 使用率モニター');
    });
    // ◀ メニューに戻る（iframe を止めてメニューへ）
    document.getElementById('back-btn').addEventListener('click', function () {
      frameScreen.style.display = 'none';
      menuScreen.style.display = 'flex';
      appFrame.src = '';
    });

    // ================================================================================
    // (1265_/D-325) 「カイポケ取込」ボタンに前回の取込日時を出す。
    //   何台かで運用したとき「もう誰かが取り込んでいる」と気づけるようにする（谷川さん明示 2026-07-27）。
    //   このページ（GitHub Pages）から GAS を fetch で直接読むことは公式に不可（CORS の事前確認 OPTIONS 非対応）。
    //   → 既に動いている「GAS を iframe に埋め込む」経路を流用し、見えない iframe から postMessage で文字列だけ受け取る。
    //   GAS は中身をさらに googleusercontent の枠に入れて出す（公式仕様の二重 iframe）ので、
    //   届く相手のオリジンは script.google.com ではなく *.googleusercontent.com になる＝そこだけを許す。
    //   読めなければ何も出さない（行ごと出ない＝今までどおりのボタン。古い日時や「済」は絶対に出さない）。
    //
    //   (1269_/D-327) 出す中身を「取込中／終わった／失敗（理由つき）」の5通りに増やし、確実に受け取れるようにした。
    //     2026-07-28 未明の不具合＝取込も記録も成功していたのにボタンに何も出なかった。
    //     落ちていたのは「画面が受け取る最後の一歩」だけ（3秒で諦める・1回きり・開いた瞬間の1回だけ）だった。
    //     → ①20秒待つ ②受け取れなければもう一度だけ試す ③30秒ごとに読み直す の3点セットにする（G-525）。
    //     受け取る側は必ず送り主（origin）と名札（type）を確かめる＝公式の推奨（MDN・2026-07-28 確認）。
    //
    //   (1271_/D-328) 谷川さん実機の困りごと2つを直す（2026-07-28）。
    //     ①押してもすぐ「取込中」にならない（合図が届くまで十数秒＋30秒ごと＝最悪40秒以上）→2回押してしまった。
    //     ②動いているのか分からない（実際は3〜4分かかるのに字が止まったまま）。
    //     → 押した瞬間に画面が自分で「取込中」に変え、同時にボタンを押せなくする（GAS の返事を待たない）。
    //       1分たっても GAS 側が取込中にならなければ、押せない状態を解いて元の表示に戻す（嘘をつかない）。
    //       取込中だけ 5秒ごとに読み直す（終わった瞬間に切り替わる）。それ以外は今までどおり30秒ごと。
    //     ★横棒の割合も「あと約○分」も GAS 側で作り終わっている＝ここでは計算しない（G-353/G-354）。
    //     ★横棒は絶対に戻さない／100% は「終わった」を受け取ったときだけ（作法・Eleken 2026-07-28）。
    // ================================================================================
    (function () {
      var card  = document.getElementById('card-kaipoke');
      var stamp = document.getElementById('kd-stamp');
      var line1 = document.getElementById('kd-stamp-t');
      var line2 = document.getElementById('kd-stamp-s');
      var spin  = document.getElementById('kd-spin');
      var cap   = document.getElementById('kd-cap');
      var barWrap = document.getElementById('kd-bar-wrap');
      var bar     = document.getElementById('kd-bar');
      if (!card || !stamp || !line1 || !line2 || !spin || !cap || !barWrap || !bar) return;

      var WAIT_MS = 20000;   // 1回あたり20秒待つ（GAS の画面はさらに別の枠に入って配られる＝初回は3秒を超えうる・G-522）
      var GAP_MS  = 30000;   // 30秒ごとに読み直す（開きっぱなしのパソコンでも新しくなる）
      var TRIES   = 2;       // 受け取れなければ、もう一度だけ作り直して試す（合計2回）
      var GAP_RUN_MS  = 5000;    // (1271_/D-328) 取込中だけ5秒ごと（終わった瞬間に切り替わる）
      var LOCAL_MS    = 60000;   // (1271_/D-328) 1分たっても GAS が取込中にならなければ元の表示に戻す
      var FIN_MS      = 800;     // (1271_/D-328) 100% を見せてから日時に切り替えるまで
      var busy = false;

      // いまの見せ方＝''（今までどおりの1行）／'local'（押した直後・GAS の返事待ち）／'run'（GAS が取込中）／'fin'（100%を見せている最中）
      var mode = '';
      var barPct = 0;        // いま出している割合（ここより下げない）
      var lastData = null;   // 押す前に出していた中身（1分で戻すときに使う）
      var mine = false;      // このパソコンが押して始めた取込かどうか（＝押せなくしてよいのは自分で押したときだけ）
      var localTimer = null;
      var gapTimer = null;
      var gapNow = 0;

      // 読み直しの間かくを切り替える（取込中だけ5秒・それ以外は30秒）
      function setGap(ms) {
        if (gapNow === ms && gapTimer) return;
        gapNow = ms;
        if (gapTimer) clearInterval(gapTimer);
        gapTimer = setInterval(tick, ms);
      }
      // 横棒＝絶対に戻さない（GAS から小さい値が来ても無視する）。snap のときだけ動かさずに置き直す。
      function setBar(pct, snap) {
        var p = Number(pct);
        if (!isFinite(p)) return;
        if (p < 0) p = 0;
        if (p > 100) p = 100;
        if (!snap && p <= barPct) return;
        barPct = p;
        if (snap) {
          bar.style.transition = 'none';
          bar.style.width = p + '%';
          void bar.offsetWidth;                 // ここで一度描かせる＝次の変化からまた動くようになる
          bar.style.transition = '';
        } else {
          bar.style.width = p + '%';
        }
      }
      // くるくる・横棒・「あと約○分」を出す／しまう
      function runVisual(on) {
        spin.hidden = !on;
        barWrap.hidden = !on;
        cap.hidden = !on;
        if (!on) { bar.classList.remove('fin'); setBar(0, true); cap.textContent = ''; }
      }
      // 時刻だけの書式（GAS の _kdHm_ と同じ＝時は0埋めしない・分だけ2桁）。
      // ★押した瞬間はまだ GAS が何も知らないので、ここだけはブラウザの時計で作る（数秒後に GAS の文字で上書きされる）。
      function hm(d) { return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }

      // 受け取る相手を Google の画面だけに絞る（送る側も宛先をこのページに限定済み＝両方やる）。
      // 名前の区切りの数は問わない（…-script.googleusercontent.com のような形も許す）が、
      // 末尾が googleusercontent.com であることは必ず確かめる＝似せ名（…googleusercontent.com.evil.com）は通さない。
      function isGasOrigin(o) {
        o = String(o);
        return o === 'https://script.google.com' || /^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(o);
      }
      // 出すのは GAS が組み立てた文字そのまま（画面側では判定も組み立てもしない＝G-353/G-354）
      //   取込中のときだけ、2行目（あと約○分）は帯の中ではなくカードの右下（.bar-cap）に出す。
      function paint(d) {
        var t = String(d.text || '').slice(0, 40);
        var s = String(d.sub  || '').slice(0, 40);
        var k = String(d.kind || '');
        stamp.className = 'home-stamp' + (k === 'ng' ? ' ng' : (k === 'run' ? ' run' : ''));
        if (!t) {                                  // 何も来なければ行ごと出さない（今までどおりのボタン）
          line1.textContent = ''; line2.textContent = ''; line2.hidden = true; stamp.hidden = true; return;
        }
        line1.textContent = t;                     // textContent＝そのまま文字として出る（作り込みを差し込まれない）
        if (s && k !== 'run') { line2.textContent = s; line2.hidden = false; }
        else                  { line2.textContent = ''; line2.hidden = true;  }
        if (k === 'run') { cap.textContent = s; }   // 「あと約○分」（95%を超えると GAS が空にしてくる）
        stamp.hidden = false;
      }
      // 取込中の見せ方をやめて、ふつうの1行へ戻す
      function endRun(d) {
        mode = '';
        mine = false;
        runVisual(false);
        card.removeAttribute('aria-disabled');
        setGap(GAP_MS);
        paint(d);
        lastData = d;
      }
      // 押した直後の「取込中」を取り消して、押す前の表示に戻す（＝起動できていないのに嘘をつかない）
      function revertLocal() {
        if (localTimer) { clearTimeout(localTimer); localTimer = null; }
        if (mode !== 'local') return;
        endRun(lastData || { text: '', sub: '', kind: '' });   // 警告は出さない＝押す前と同じ見た目に戻すだけ
      }
      function show(d) {
        var k = String(d.kind || '');
        if (mode === 'fin') return;                      // 100% を見せている最中は割り込ませない
        if (k === 'run') {                               // GAS が「取込中」＝ここからは本物の割合で動かす
          if (localTimer) { clearTimeout(localTimer); localTimer = null; }
          mode = 'run';
          runVisual(true);
          setGap(GAP_RUN_MS);
          paint(d);
          if (d.progress) setBar(d.progress.pct);        // 小さい値は setBar が無視する＝戻らない
          return;
        }
        if (mode === 'local') return;                    // 押した直後＝GAS がまだ取込中になっていない（1分たてば戻す）
        if (mode === 'run') {                            // 取込中が終わった
          if (k === 'ok') {                              // 本当に終わったときだけ 100% にしてから日時へ
            mode = 'fin';
            bar.classList.add('fin');
            setBar(100);
            setTimeout(function () { mode = 'run'; endRun(d); }, FIN_MS);
          } else {
            endRun(d);                                   // 失敗・記録なし＝100% にしない（偽らない）
          }
          return;
        }
        paint(d);
        lastData = d;
      }

      // カイポケ取込（このパソコンの「カイポケ取込」を起動する＝画面内はめ込みでは動かないので location で開く）
      card.addEventListener('click', function () {
        if (mine) return;                       // 二重押しを止める（1分たつか、取込が終われば自動的に解ける）
        location.href = 'sumire-kaipoke:run';
        mine = true;
        mode = 'local';
        card.setAttribute('aria-disabled', 'true');
        lastData = lastData || { text: '', sub: '', kind: '' };
        runVisual(true);
        setBar(0, true);
        cap.textContent = '';
        paint({ text: '取込中（' + hm(new Date()) + 'から）', sub: '', kind: 'run' });
        setGap(GAP_RUN_MS);
        if (localTimer) clearTimeout(localTimer);
        localTimer = setTimeout(revertLocal, LOCAL_MS);
        tick();                                          // すぐ読みに行く（GAS が取込中になり次第、本物の割合に切り替わる）
      });
      function ask(triesLeft) {
        var got = false, fr = null, timer = null;
        function cleanup() {
          window.removeEventListener('message', onMsg);
          if (timer) { clearTimeout(timer); timer = null; }
          if (fr && fr.parentNode) { fr.parentNode.removeChild(fr); }
          fr = null;
        }
        function onMsg(ev) {
          if (got) return;
          if (!isGasOrigin(ev.origin)) return;                 // 送り主違いは捨てる
          var d = ev.data || {};
          if (d.type !== 'kd-last-import') return;             // 名札違いは捨てる
          got = true;
          cleanup();
          busy = false;
          show(d);
        }
        window.addEventListener('message', onMsg);
        fr = document.createElement('iframe');
        fr.style.cssText = 'position:absolute;width:0;height:0;border:0;left:-9999px;top:-9999px;';
        fr.setAttribute('aria-hidden', 'true');
        fr.setAttribute('title', '');
        fr.src = EXEC + '?view=lastimport&t=' + Date.now();     // 毎回ちがう合言葉＝古い写しを見せられない
        document.body.appendChild(fr);
        timer = setTimeout(function () {
          if (got) return;
          cleanup();
          if (triesLeft > 1) { ask(triesLeft - 1); }            // もう一度だけ作り直して試す
          else { busy = false; }                                // 受け取れなかった＝いまの表示はそのまま（消さない）
        }, WAIT_MS);
      }
      function tick() {
        if (busy) return;
        if (document.hidden) return;   // 裏に回っている間は休む（無駄なアクセスをしない・API-1）
        busy = true;
        ask(TRIES);
      }
      tick();
      setGap(GAP_MS);
      // 裏から戻ったらすぐ読み直す（裏にいる間はブラウザが時計を遅らせる＝公式仕様・2026-07-28 確認）
      document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    })();
  </script>
</body>
